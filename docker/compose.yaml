services:

  #
  # PostgreSQL
  # Primary storage backend for the Docker deployment.
  #

  postgresql:
    container_name: 'litegraph-postgresql'
    image: 'postgres:17'
    stdin_open: true
    tty: true
    ports:
      - '${LITEGRAPH_POSTGRESQL_HOST_PORT:-15432}:5432'
    environment:
      POSTGRES_DB: '${LITEGRAPH_POSTGRESQL_DATABASE:-litegraph}'
      POSTGRES_USER: '${LITEGRAPH_POSTGRESQL_USERNAME:-litegraph}'
      POSTGRES_PASSWORD: '${LITEGRAPH_POSTGRESQL_PASSWORD:-litegraph}'
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 2s
      retries: 10

  #
  # LiteGraph PostgreSQL Initialization
  # Creates the schema, tables, built-in roles, default login records, and
  # starter graph data before the long-running server starts.
  #

  litegraph-postgresql-init:
    container_name: 'litegraph-postgresql-init'
    image: 'jchristn77/litegraph:v8.1.0'
    stdin_open: true
    tty: true
    depends_on:
      postgresql:
        condition: service_healthy
    command:
      - '--config=/app/litegraph.json'
      - '--init-only'
    restart: 'no'
    environment:
      LITEGRAPH_DB_TYPE: 'Postgresql'
      LITEGRAPH_DB_HOST: 'postgresql'
      LITEGRAPH_DB_PORT: '5432'
      LITEGRAPH_DB_NAME: '${LITEGRAPH_POSTGRESQL_DATABASE:-litegraph}'
      LITEGRAPH_DB_USERNAME: '${LITEGRAPH_POSTGRESQL_USERNAME:-litegraph}'
      LITEGRAPH_DB_PASSWORD: '${LITEGRAPH_POSTGRESQL_PASSWORD:-litegraph}'
      LITEGRAPH_DB_SCHEMA: '${LITEGRAPH_POSTGRESQL_SCHEMA:-litegraph}'
      LITEGRAPH_DB_MAX_CONNECTIONS: '${LITEGRAPH_DB_MAX_CONNECTIONS:-32}'
      LITEGRAPH_DB_COMMAND_TIMEOUT_SECONDS: '${LITEGRAPH_DB_COMMAND_TIMEOUT_SECONDS:-30}'
    volumes:
      - ./litegraph.json:/app/litegraph.json
      - ./:/app/docker/
      - ./logs/litegraph/:/app/logs/
      - ./backups/litegraph/:/app/backups/

  #
  # LiteGraph Server
  # See https://hub.docker.com/r/jchristn77/litegraph
  # and https://github.com/jchristn/LiteGraph
  #
  # Chat/LLM connectivity: to reach an Ollama (or other OpenAI-compatible)
  # server running on the Docker host, point chat endpoints at
  # http://host.docker.internal:11434. Docker Desktop (Windows/macOS) resolves
  # host.docker.internal automatically; on Linux add
  # extra_hosts: ['host.docker.internal:host-gateway'] to this service
  # (equivalent to --add-host=host.docker.internal:host-gateway).
  #

  litegraph:
    container_name: 'litegraph'
    restart: 'unless-stopped'
    image: 'jchristn77/litegraph:v8.1.0'
    stdin_open: true
    tty: true
    ports:
      - '8701:8701'
    depends_on:
      litegraph-postgresql-init:
        condition: service_completed_successfully
    environment:
      LITEGRAPH_DB_TYPE: 'Postgresql'
      LITEGRAPH_DB_HOST: 'postgresql'
      LITEGRAPH_DB_PORT: '5432'
      LITEGRAPH_DB_NAME: '${LITEGRAPH_POSTGRESQL_DATABASE:-litegraph}'
      LITEGRAPH_DB_USERNAME: '${LITEGRAPH_POSTGRESQL_USERNAME:-litegraph}'
      LITEGRAPH_DB_PASSWORD: '${LITEGRAPH_POSTGRESQL_PASSWORD:-litegraph}'
      LITEGRAPH_DB_SCHEMA: '${LITEGRAPH_POSTGRESQL_SCHEMA:-litegraph}'
      LITEGRAPH_DB_MAX_CONNECTIONS: '${LITEGRAPH_DB_MAX_CONNECTIONS:-32}'
      LITEGRAPH_DB_COMMAND_TIMEOUT_SECONDS: '${LITEGRAPH_DB_COMMAND_TIMEOUT_SECONDS:-30}'
    volumes:
      - ./litegraph.json:/app/litegraph.json
      # Mount the full docker directory so vector indexes, backups, logs, and
      # optional migration artifacts persist together.
      - ./:/app/docker/
      - ./logs/litegraph/:/app/logs/
      - ./backups/litegraph/:/app/backups/
    healthcheck:
      test: curl --fail http://localhost:8701
      interval: 5s
      timeout: 2s
      retries: 3

  #
  # LiteGraph MCP Server
  # See https://hub.docker.com/r/jchristn77/litegraph-mcp
  # and https://github.com/jchristn/LiteGraph
  #

  litegraph-mcp:
    container_name: 'litegraph-mcp'
    restart: 'unless-stopped'
    image: 'jchristn77/litegraph-mcp:v8.1.0'
    stdin_open: true
    tty: true
    ports:
      - '8702:8702'
      - '8703:8703'
      - '8704:8704'
      - '8705:8705'
    depends_on:
      litegraph:
        condition: service_healthy
    environment:
      # Expose the MCP Prometheus metrics endpoint on all interfaces (scraped at 8705).
      MCP_METRICS_HOSTNAME: '*'
      MCP_METRICS_PORT: '8705'
      # Route MCP structured syslog to Grafana Alloy (component="mcp" listener).
      MCP_SYSLOG_HOSTNAME: 'alloy'
      MCP_SYSLOG_PORT: '2514'
    volumes:
      - ./litegraph-mcp.json:/app/litegraph.json
      - ./logs/litegraph-mcp/:/app/logs/
      - ./backups/litegraph-mcp/:/app/backups/
    healthcheck:
      test: curl --fail http://localhost:8702
      interval: 5s
      timeout: 2s
      retries: 3

  #
  # LiteGraph UI
  # See https://hub.docker.com/r/jchristn77/litegraph-ui
  # and https://github.com/jchristn/LiteGraph/tree/master/dashboard
  #

  litegraph-ui:
    container_name: 'litegraph-ui'
    restart: 'unless-stopped'
    image: 'jchristn77/litegraph-ui:v8.1.0'
    stdin_open: true
    tty: true
    ports:
      - '3001:3000'
    depends_on:
      litegraph:
        condition: service_healthy
    # Publish the UI on host port 3001 so Grafana can keep using 3000.
    healthcheck:
      test: curl --fail http://localhost:3000
      interval: 5s
      timeout: 2s
      retries: 3

  #
  # Prometheus
  # Scrapes LiteGraph metrics from http://litegraph:8701/metrics.
  #

  prometheus:
    container_name: 'litegraph-prometheus'
    image: 'prom/prometheus:v3.14.0'
    stdin_open: true
    tty: true
    ports:
      - '9090:9090'
    depends_on:
      litegraph:
        condition: service_healthy
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus

  #
  # Grafana OSS
  # Preconfigured with Prometheus and the LiteGraph dashboard.
  #

  #
  # Grafana Loki
  # Stores LiteGraph server and MCP logs forwarded by Grafana Alloy.
  #

  loki:
    container_name: 'litegraph-loki'
    image: 'grafana/loki:3.3.0'
    stdin_open: true
    tty: true
    ports:
      - '3100:3100'
    command:
      - '-config.file=/etc/loki/config.yaml'
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  #
  # Grafana Alloy
  # Receives LiteGraph server and MCP structured syslog (UDP) and forwards it to Loki.
  #

  alloy:
    container_name: 'litegraph-alloy'
    image: 'grafana/alloy:v1.5.0'
    stdin_open: true
    tty: true
    ports:
      - '12345:12345'
    depends_on:
      loki:
        condition: service_started
    command:
      - 'run'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '--storage.path=/var/lib/alloy/data'
      - '/etc/alloy/config.alloy'
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data

  #
  # Syslog shim
  # SyslogLogging stamps RFC3164 frames with a zero-padded day ("Sep 02");
  # Alloy's strict RFC3164 parser requires space padding ("Sep  2") and drops
  # every frame otherwise. This relay rewrites the day field and forwards to
  # Alloy so LiteGraph logs actually land in Loki. Remove once SyslogLogging
  # emits compliant timestamps.
  #

  syslog-shim:
    container_name: 'litegraph-syslog-shim'
    image: 'python:3.12-alpine'
    restart: 'unless-stopped'
    depends_on:
      alloy:
        condition: service_started
    command:
      - 'python'
      - '-u'
      - '-c'
      - |
        import re, socket, threading
        def relay(listen_port, target_port):
            rx = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
            rx.bind(('0.0.0.0', listen_port))
            tx = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
            pat = re.compile(rb'^(<\d+>)([A-Z][a-z]{2}) 0(\d) ')
            print('relaying udp', listen_port, '-> alloy:' + str(target_port), flush=True)
            while True:
                data, _ = rx.recvfrom(65535)
                data = pat.sub(rb'\g<1>\g<2>  \g<3> ', data, count=1)
                try:
                    tx.sendto(data, ('alloy', target_port))
                except OSError:
                    pass
        threading.Thread(target=relay, args=(2514, 2514), daemon=True).start()
        relay(1514, 1514)

  #
  # Grafana OSS
  # Preconfigured with Prometheus, Loki, and the LiteGraph dashboard.
  #

  grafana:
    container_name: 'litegraph-grafana'
    image: 'grafana/grafana-oss:13.0.2'
    stdin_open: true
    tty: true
    ports:
      - '3000:3000'
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: 'admin'
      GF_SECURITY_ADMIN_PASSWORD: 'admin'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../assets/grafana:/var/lib/grafana/dashboards/litegraph:ro

volumes:
  postgresql-data:
  prometheus-data:
  grafana-storage:
  loki-data:
  alloy-data:

