#
# LiteGraph: single node on SQLite (vector search through the in-process HnswLite index)
#
# Start:     docker compose up -d
# Stop:      docker compose down
# Update:    update.bat
# Validate:  smoke.bat (or pwsh ./smoke.ps1)
# Reset:     factory/reset.bat (destroys data)
#
# REST API     http://127.0.0.1:8701     (admin bearer token: litegraphadmin)
# Dashboard    http://127.0.0.1:3001
# MCP          http://127.0.0.1:8702     (TCP 8703, WebSocket 8704, metrics 8705)
# Grafana      http://127.0.0.1:3000     (admin / admin)
# Prometheus   http://127.0.0.1:9090
#
# The database and vector index files live in ./data (created on first start with the
# default tenant, user, and credential).  SQLite supports one node only; for more than one
# node use ../multi-node.  Host ports are configurable through the LITEGRAPH_*_HOST_PORT
# variables listed in .env.example; this stack uses the same default ports as the other
# deployments, so run one at a time.
#
# Image tags: LITEGRAPH_IMAGE_TAG selects the LiteGraph images (default v10.2.0).
#

name: litegraph-sqlite

services:

  #
  # LiteGraph server
  #
  # Chat/LLM connectivity: to reach an Ollama (or other OpenAI-compatible) server on the
  # Docker host, point chat endpoints at http://host.docker.internal:11434.  On Linux
  # uncomment extra_hosts below.
  #

  litegraph:
    image: 'jchristn77/litegraph:${LITEGRAPH_IMAGE_TAG:-v10.2.0}'
    restart: 'unless-stopped'
    ports:
      - '${LITEGRAPH_REST_HOST_PORT:-8701}:8701'
    depends_on:
      syslog-shim:
        condition: service_started
    # extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      LITEGRAPH_DB_TYPE: 'Sqlite'
      LITEGRAPH_DB_FILENAME: './data/litegraph.db'
      LITEGRAPH_CREATE_DEFAULT_RECORDS: 'true'
    volumes:
      - ./litegraph.json:/app/litegraph.json
      - ./data/:/app/data/
      - ./logs/litegraph/:/app/logs/
      - ./backups/litegraph/:/app/backups/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8701/v1.0/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 60s

  #
  # LiteGraph MCP server
  #

  litegraph-mcp:
    image: 'jchristn77/litegraph-mcp:${LITEGRAPH_IMAGE_TAG:-v10.2.0}'
    restart: 'unless-stopped'
    ports:
      - '${LITEGRAPH_MCP_HOST_PORT:-8702}:8702'
      - '${LITEGRAPH_MCP_TCP_HOST_PORT:-8703}:8703'
      - '${LITEGRAPH_MCP_WS_HOST_PORT:-8704}:8704'
      - '${LITEGRAPH_MCP_METRICS_HOST_PORT:-8705}:8705'
    depends_on:
      litegraph:
        condition: service_healthy
    environment:
      MCP_METRICS_HOSTNAME: '*'
      MCP_METRICS_PORT: '8705'
      MCP_SYSLOG_HOSTNAME: 'alloy'
      MCP_SYSLOG_PORT: '2514'
    volumes:
      - ./litegraph-mcp.json:/app/litegraph.json
      - ./logs/litegraph-mcp/:/app/logs/
      - ./backups/litegraph-mcp/:/app/backups/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8702"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s

  #
  # LiteGraph dashboard (host port 3001 so Grafana keeps 3000)
  #

  litegraph-ui:
    image: 'jchristn77/litegraph-ui:${LITEGRAPH_IMAGE_TAG:-v10.2.0}'
    restart: 'unless-stopped'
    ports:
      - '${LITEGRAPH_UI_HOST_PORT:-3001}:3000'
    depends_on:
      litegraph:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s

  #
  # Observability: Prometheus, Loki, Alloy (syslog to Loki), Grafana
  #

  prometheus:
    image: 'prom/prometheus:v3.14.0'
    restart: 'unless-stopped'
    ports:
      - '${LITEGRAPH_PROMETHEUS_HOST_PORT:-9090}:9090'
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 2s
      retries: 2

  loki:
    image: 'grafana/loki:3.3.0'
    restart: 'unless-stopped'
    ports:
      - '${LITEGRAPH_LOKI_HOST_PORT:-3100}:3100'
    command:
      - '-config.file=/etc/loki/config.yaml'
    volumes:
      - ../shared/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  alloy:
    image: 'grafana/alloy:v1.5.0'
    restart: 'unless-stopped'
    ports:
      - '${LITEGRAPH_ALLOY_HOST_PORT:-12345}:12345'
    depends_on:
      loki:
        condition: service_started
    command:
      - 'run'
      - '--server.http.listen-addr=0.0.0.0:12345'
      - '--storage.path=/var/lib/alloy/data'
      - '/etc/alloy/config.alloy'
    volumes:
      - ../shared/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data

  syslog-shim:
    image: 'python:3.12-alpine'
    restart: 'unless-stopped'
    depends_on:
      alloy:
        condition: service_started
    command:
      - 'python'
      - '/app/syslog-shim.py'
    volumes:
      - ../shared/syslog-shim/syslog-shim.py:/app/syslog-shim.py:ro

  grafana:
    image: 'grafana/grafana-oss:13.0.2'
    restart: 'unless-stopped'
    ports:
      - '${LITEGRAPH_GRAFANA_HOST_PORT:-3000}:3000'
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: 'admin'
      GF_SECURITY_ADMIN_PASSWORD: 'admin'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - grafana-storage:/var/lib/grafana
      - ../shared/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../shared/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../assets/grafana:/var/lib/grafana/dashboards/litegraph:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 30s

volumes:
  prometheus-data:
  grafana-storage:
  loki-data:
  alloy-data:
