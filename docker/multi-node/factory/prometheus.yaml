global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Each LiteGraph node is scraped directly (never through the load balancer) so every node's
# metrics are visible.  The node label names the node on every series; the Grafana dashboards
# filter on it, and up{job="litegraph"} shows which nodes answered.
scrape_configs:
  - job_name: litegraph
    metrics_path: /metrics
    static_configs:
      - targets: ['litegraph-1:8701']
        labels:
          component: rest
          node: litegraph-1
      - targets: ['litegraph-2:8701']
        labels:
          component: rest
          node: litegraph-2
      - targets: ['litegraph-3:8701']
        labels:
          component: rest
          node: litegraph-3

  - job_name: litegraph-mcp
    metrics_path: /metrics
    static_configs:
      - targets:
          - litegraph-mcp:8705
        labels:
          component: mcp
          node: litegraph-mcp
