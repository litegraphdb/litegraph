#
# Load balancer in front of the Clutch nodes, used by the LiteGraph nodes for distributed locks.
#
# LiteGraph talks to Clutch over its REST lock API.  Clutch also offers a WebSocket lock API,
# so upgrade headers are passed through for clients that use it; ip_hash keeps such
# long-lived connections on one node.  Lock correctness does not depend on affinity:
# PostgreSQL is the authority for lock state.
#
# This is a separate service from the LiteGraph load balancer on purpose: the LiteGraph nodes
# depend on Clutch being reachable, and the LiteGraph load balancer depends on the LiteGraph
# nodes, so one shared Nginx would create a startup dependency cycle.
#

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream clutch_nodes {
        ip_hash;
        server clutch-1:8080 max_fails=2 fail_timeout=10s;
        server clutch-2:8080 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8090;
        server_name _;

        proxy_buffering off;
        # Lock waits are held open by Clutch for up to a minute.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        location / {
            proxy_pass http://clutch_nodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
