#
# Load balancer in front of the Clutch nodes, used by the LiteGraph nodes for distributed locks.
#
# Each LiteGraph node holds one long-lived WebSocket lock connection to Clutch (Clutch.Sdk),
# so upgrade headers are passed through.  least_conn spreads those connections across the
# Clutch nodes (ip_hash would not: it hashes only the first three octets of an IPv4 address,
# so every container on the Docker network would land on the same node).  Lock correctness
# does not depend on which node a connection reaches: PostgreSQL is the authority for lock
# state.  If a Clutch node stops, its connections close, Clutch releases their locks, and the
# LiteGraph nodes reconnect through the other Clutch node.  A stopped container's address
# does not refuse connections, it just stops answering, so the short connect timeout below
# is what makes a reconnect fail over within seconds instead of a minute.
#
# This is a separate service from the LiteGraph load balancer on purpose: the LiteGraph nodes
# depend on Clutch being reachable, and the LiteGraph load balancer depends on the LiteGraph
# nodes, so one shared Nginx would create a startup dependency cycle.
#

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream clutch_nodes {
        least_conn;
        server clutch-1:8080 max_fails=2 fail_timeout=10s;
        server clutch-2:8080 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 8090;
        server_name _;

        proxy_buffering off;
        proxy_connect_timeout 2s;
        # Lock connections are long-lived and quiet while no lock is held; an idle connection
        # closed here is simply reopened by the LiteGraph node.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        location / {
            proxy_pass http://clutch_nodes;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
