#
# Load balancer in front of the LiteGraph nodes.
#
# Every node can answer every request (nodes keep no state of their own), so no session
# affinity is needed.  least_conn suits LiteGraph's mix of short CRUD calls and long chat
# streams better than round robin.  Open-source Nginx checks backends passively: a node
# that fails twice within 10 seconds is skipped for 10 seconds.
#

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream litegraph_nodes {
        least_conn;
        server litegraph-1:8701 max_fails=2 fail_timeout=10s;
        server litegraph-2:8701 max_fails=2 fail_timeout=10s;
        server litegraph-3:8701 max_fails=2 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 8701;
        server_name _;

        # Chat responses stream (SSE); imports and bulk writes can be large.
        client_max_body_size 512m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Fail over on connection errors and gateway errors.  Nginx never retries
        # non-idempotent methods (POST) unless told to, and this configuration does not.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;

        location / {
            proxy_pass http://litegraph_nodes;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header X-LiteGraph-Upstream $upstream_addr always;
        }
    }
}
