name: CI

# Every test runs on every commit to any branch and on every pull request, on Linux, macOS, and Windows:
#   - the Touchstone suites (console, xUnit, and NUnit runners) on net10.0 and net8.0, with PostgreSQL and Redis on Linux;
#   - Native AOT: src/Test.Aot, and the REST server, MCP server, and console tools published as native executables, with
#     the Touchstone suites run again against the native servers;
#   - the C# SDK suite (JIT and Native AOT) against a live server, and the JavaScript and Python SDK and dashboard tests;
#   - on Linux, the Docker deployments (default and Native AOT images) with their smoke and failover scripts.

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

# A newer commit on a branch or pull request supersedes an older run; every commit to main runs to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  dotnet:
    name: .NET (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
            exe: ''
          - os: macos-15
            rid: osx-arm64
            exe: ''
          - os: windows-2025
            rid: win-x64
            exe: '.exe'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Start PostgreSQL (pgvector) and Redis (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name ci-postgres -p 5432:5432 -e POSTGRES_DB=litegraph_ci -e POSTGRES_USER=litegraph -e POSTGRES_PASSWORD=litegraph pgvector/pgvector:0.8.6-pg17-trixie
          docker run -d --name ci-redis -p 6379:6379 redis:7.4.9-alpine redis-server --save '' --appendonly no
          for i in $(seq 1 60); do docker exec ci-postgres pg_isready -h 127.0.0.1 -U litegraph -d litegraph_ci && break; sleep 2; done
          for i in $(seq 1 30); do docker exec ci-redis redis-cli ping | grep -q PONG && break; sleep 1; done
          echo "LITEGRAPH_TEST_POSTGRESQL_CONNECTION_STRING=Host=127.0.0.1;Port=5432;Database=litegraph_ci;Username=litegraph;Password=litegraph;Maximum Pool Size=90;Timeout=15;Command Timeout=60" >> "$GITHUB_ENV"
          echo "LITEGRAPH_TEST_REDIS_CONNECTION_STRING=127.0.0.1:6379" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore src/LiteGraph.sln

      - name: Build (warnings are errors)
        run: dotnet build src/LiteGraph.sln -c Debug --no-restore -warnaserror

      - name: Vulnerability audit
        if: runner.os == 'Linux'
        run: dotnet list src/LiteGraph.sln package --vulnerable --include-transitive

      - name: NuGet package validation
        if: runner.os == 'Linux'
        run: |
          dotnet build src/LiteGraph/LiteGraph.csproj -c Release
          dotnet pack src/LiteGraph/LiteGraph.csproj -c Release --no-build -o artifacts/nuget

      - name: Touchstone suites (net10.0)
        run: dotnet run --project src/Test.Automated/Test.Automated.csproj -c Debug --framework net10.0 --no-build

      - name: Touchstone suites (net8.0)
        run: dotnet run --project src/Test.Automated/Test.Automated.csproj -c Debug --framework net8.0 --no-build

      - name: Transaction concurrency gate
        run: dotnet run --project src/Test.Automated/Test.Automated.csproj -c Debug --framework net10.0 --no-build -- --transaction-concurrency

      - name: Serialization parity outside UTC (Asia/Kolkata)
        if: runner.os != 'Windows'
        env:
          # A non-UTC zone with a half-hour offset, so time-zone bugs in timestamp handling cannot pass unnoticed.
          TZ: Asia/Kolkata
        run: dotnet run --project src/Test.Automated/Test.Automated.csproj -c Debug --framework net10.0 --no-build -- --suite Aot.Serialization,Aot.Server

      - name: xUnit runner
        run: dotnet test src/Test.Xunit/Test.Xunit.csproj -c Debug --framework net10.0 --no-build

      - name: NUnit runner
        run: dotnet test src/Test.Nunit/Test.Nunit.csproj -c Debug --framework net10.0 --no-build

      - name: Native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Native AOT library (src/Test.Aot, net10.0 and net8.0)
        run: |
          for framework in net10.0 net8.0; do
            dotnet publish src/Test.Aot/Test.Aot.csproj -c Release -f "$framework" -r ${{ matrix.rid }} -o "artifacts/aot/$framework"
            "artifacts/aot/$framework/Test.Aot${{ matrix.exe }}"
          done

      - name: Native AOT publish (REST server, MCP server, console tools)
        run: |
          for project in LiteGraph.Server LiteGraph.McpServer LiteGraphConsole LiteGraph.SampleDatabase LoadGenerator; do
            dotnet publish "src/$project/$project.csproj" -c Release -f net10.0 -r ${{ matrix.rid }} -p:PublishAot=true -o "artifacts/native/$project"
          done
          dotnet publish src/LiteGraph.Server/LiteGraph.Server.csproj -c Release -f net8.0 -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/native8/LiteGraph.Server
          dotnet publish src/LiteGraph.McpServer/LiteGraph.McpServer.csproj -c Release -f net8.0 -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/native8/LiteGraph.McpServer

      - name: Touchstone suites against the native REST and MCP servers (net10.0 build)
        env:
          LITEGRAPH_TEST_SERVER_EXECUTABLE: artifacts/native/LiteGraph.Server/LiteGraph.Server${{ matrix.exe }}
          LITEGRAPH_TEST_MCP_EXECUTABLE: artifacts/native/LiteGraph.McpServer/LiteGraph.McpServer${{ matrix.exe }}
        run: dotnet run --project src/Test.Automated/Test.Automated.csproj -c Debug --framework net10.0 --no-build

      - name: Server-backed suites against the native REST and MCP servers (net8.0 build)
        env:
          LITEGRAPH_TEST_SERVER_EXECUTABLE: artifacts/native8/LiteGraph.Server/LiteGraph.Server${{ matrix.exe }}
          LITEGRAPH_TEST_MCP_EXECUTABLE: artifacts/native8/LiteGraph.McpServer/LiteGraph.McpServer${{ matrix.exe }}
        run: >-
          dotnet run --project src/Test.Automated/Test.Automated.csproj -c Debug --framework net8.0 --no-build --
          --suite Mcp.Protocol,Mcp.Server,Authorization,Onboarding,Observability,Chat.Rest,Improvements.Foundation,Aot.Server

      - name: Native console tools
        run: |
          db="$RUNNER_TEMP/native-sample.db"
          "artifacts/native/LiteGraph.SampleDatabase/LiteGraph.SampleDatabase${{ matrix.exe }}" --database "$db"
          "artifacts/native/LiteGraphConsole/LiteGraphConsole${{ matrix.exe }}" --database "$db" \
            --tenant 00000000-0000-0000-0000-000000000000 --graph 00000000-0000-0000-0000-000000000000 \
            --execute "MATCH (n) RETURN n LIMIT 3" | tee "$RUNNER_TEMP/lg.txt"
          grep -q '"Rows"' "$RUNNER_TEMP/lg.txt"
          "artifacts/native/LoadGenerator/LoadGenerator${{ matrix.exe }}" --sqlite "$RUNNER_TEMP/native-load.db" \
            --graphs 2 --nodes 20 --days 1 --requests 50 --chat-threads 2 --chat-turns 2

      - name: C# SDK suite against a live native server (JIT and Native AOT)
        env:
          # 127.0.0.1, not localhost: on Windows, localhost tries IPv6 first and every refused ::1 connection costs about
          # two seconds before the IPv4 fallback.
          LITEGRAPH_ENDPOINT: http://127.0.0.1:8701
        run: |
          server_dir="$RUNNER_TEMP/sdk-server"
          mkdir -p "$server_dir"
          cd "$server_dir"
          "$GITHUB_WORKSPACE/artifacts/native/LiteGraph.Server/LiteGraph.Server${{ matrix.exe }}" > "$server_dir/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          cd "$GITHUB_WORKSPACE"
          for i in $(seq 1 60); do
            if curl -sf "$LITEGRAPH_ENDPOINT/v1.0/health/ready" > /dev/null; then break; fi
            sleep 1
          done
          curl -sf "$LITEGRAPH_ENDPOINT/v1.0/health/ready" > /dev/null || { cat "$server_dir/server.log"; exit 1; }
          dotnet run --project sdk/csharp/src/Test.Automated/Test.Automated.csproj -c Release
          dotnet publish sdk/csharp/src/Test.Automated/Test.Automated.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/sdk-aot
          "artifacts/sdk-aot/Test.Automated${{ matrix.exe }}"

      - name: Collect test logs
        if: failure()
        run: |
          # upload-artifact only takes files under the workspace, so copy the server and Touchstone logs in first.
          mkdir -p artifacts/logs
          for dir in "$RUNNER_TEMP" /tmp/LiteGraph.Touchstone; do
            [ -d "$dir" ] || continue
            find "$dir" -name '*.log' -type f 2>/dev/null | while read -r f; do
              rel="${f#$dir/}"
              mkdir -p "artifacts/logs/$(basename "$dir")/$(dirname "$rel")"
              cp "$f" "artifacts/logs/$(basename "$dir")/$rel" || true
            done
          done

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-${{ matrix.os }}-logs
          path: artifacts/logs/
          if-no-files-found: ignore
          retention-days: 14

  javascript-sdk:
    name: JavaScript SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --runInBand

      - name: Package dry run
        run: npm pack --dry-run

  python-sdk:
    name: Python SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ".[testing]"

      - name: Test
        run: pytest

      - name: Package build
        run: python -m build

  dashboard:
    name: Dashboard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  docker-config:
    name: Docker configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate compose files, profiles, and Native AOT overrides
        env:
          LITEGRAPH_IMAGE_TAG: ci-validate
        run: |
          set -euo pipefail
          for d in single-node-sqlite single-node-postgresql multi-node; do
            docker compose -f docker/$d/compose.yaml config -q
            docker compose -f docker/$d/compose.yaml -f docker/$d/compose.native.yaml config -q
            echo "valid: docker/$d/compose.yaml (default and native)"
          done
          docker compose -f docker/multi-node/compose.yaml --profile switchboard --profile tools config -q
          echo "valid: docker/multi-node/compose.yaml with profiles switchboard and tools"

      - name: Shell scripts use LF and parse
        run: |
          set -euo pipefail
          if git ls-files --eol '*.sh' | grep -q 'w/crlf'; then git ls-files --eol '*.sh' | grep 'w/crlf'; echo "CRLF found in the shell scripts above"; exit 1; fi
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
          echo "all shell scripts parse"

  deploy:
    name: Docker deployment (${{ matrix.deployment }}, ${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        deployment: [single-node-sqlite, single-node-postgresql, multi-node]
        variant: [jit, native]
    env:
      LITEGRAPH_IMAGE_TAG: ci-${{ github.sha }}
      COMPOSE_FILE: ${{ matrix.variant == 'native' && 'compose.yaml:compose.native.yaml' || 'compose.yaml' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build images from this commit (not pushed)
        run: |
          set -euo pipefail
          if [ "${{ matrix.variant }}" = "native" ]; then
            docker build -f src/LiteGraph.Server/Dockerfile.native -t jchristn77/litegraph:$LITEGRAPH_IMAGE_TAG-native src
            docker build -f src/LiteGraph.McpServer/Dockerfile.native -t jchristn77/litegraph-mcp:$LITEGRAPH_IMAGE_TAG-native .
          else
            docker build -f src/LiteGraph.Server/Dockerfile -t jchristn77/litegraph:$LITEGRAPH_IMAGE_TAG src
            docker build -f src/LiteGraph.McpServer/Dockerfile -t jchristn77/litegraph-mcp:$LITEGRAPH_IMAGE_TAG .
          fi
          docker build -t jchristn77/litegraph-ui:$LITEGRAPH_IMAGE_TAG dashboard

      - name: Start ${{ matrix.deployment }}
        working-directory: docker/${{ matrix.deployment }}
        run: |
          if [ "${{ matrix.deployment }}" = "multi-node" ]; then
            docker compose --profile switchboard up -d --wait --pull missing
          else
            docker compose up -d --wait --pull missing
          fi

      - name: Smoke test
        working-directory: docker/${{ matrix.deployment }}
        shell: pwsh
        run: ./smoke.ps1

      - name: Failover test
        if: matrix.deployment == 'multi-node'
        working-directory: docker/multi-node
        shell: pwsh
        run: ./failover.ps1

      - name: Container logs
        if: failure()
        working-directory: docker/${{ matrix.deployment }}
        run: docker compose --profile switchboard logs --no-color > compose-logs.txt || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-${{ matrix.deployment }}-${{ matrix.variant }}-logs
          path: docker/${{ matrix.deployment }}/compose-logs.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down
        if: always()
        working-directory: docker/${{ matrix.deployment }}
        run: docker compose --profile switchboard --profile tools down -v || true
