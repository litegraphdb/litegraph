name: CI

on:
  push:
    branches:
      - main
      - v7.0
      - V10.0
  pull_request:
    branches:
      - main
      - v7.0
      - V10.0
  workflow_dispatch:
  schedule:
    # Nightly full deployment run (images built from the commit, never pushed).
    - cron: '17 6 * * *'

jobs:
  dotnet:
    name: .NET build and transaction gates
    runs-on: ubuntu-24.04
    services:
      postgres:
        # LiteGraph 10 stores vectors with pgvector; the extension must be installable.
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_DB: litegraph_ci
          POSTGRES_USER: litegraph
          POSTGRES_PASSWORD: litegraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U litegraph -d litegraph_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        # Cluster node registry and rolling restart tests (ScaleOut suite).
        image: redis:7.4.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -h 127.0.0.1 ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore src/LiteGraph.sln

      - name: Build
        run: dotnet build src/LiteGraph.sln -c Debug --no-restore

      - name: Vulnerability audit
        run: dotnet list src/LiteGraph.sln package --vulnerable --include-transitive

      - name: NuGet package validation
        run: |
          dotnet build src/LiteGraph/LiteGraph.csproj -c Release
          dotnet pack src/LiteGraph/LiteGraph.csproj -c Release --no-build -o artifacts/nuget

      - name: SQLite transaction concurrency gate
        run: dotnet run --project src/Test.Automated/Test.Automated.csproj -c Debug --framework net10.0 -- --transaction-concurrency

      - name: PostgreSQL transaction concurrency gate
        env:
          LITEGRAPH_TEST_POSTGRESQL_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=litegraph_ci;Username=litegraph;Password=litegraph;Maximum Pool Size=90;Timeout=15;Command Timeout=60
        run: dotnet run --project src/Test.Automated/Test.Automated.csproj -c Debug --framework net10.0 -- --transaction-concurrency

      - name: Scale-out suite (pgvector, locks, settings, Redis node registry, rolling restart)
        env:
          LITEGRAPH_TEST_POSTGRESQL_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=litegraph_ci;Username=litegraph;Password=litegraph;Maximum Pool Size=90;Timeout=15;Command Timeout=60
          LITEGRAPH_TEST_REDIS_CONNECTION_STRING: 127.0.0.1:6379
        run: dotnet run --project src/Test.Automated/Test.Automated.csproj -c Debug --framework net10.0 -- --suite ScaleOut

      - name: Serialization parity suite (JSON pinned to the 10.1 baselines, run outside UTC)
        env:
          # A non-UTC zone with a half-hour offset, so time-zone bugs in timestamp handling cannot pass unnoticed.
          TZ: Asia/Kolkata
        run: dotnet run --project src/Test.Automated/Test.Automated.csproj -c Debug --framework net10.0 -- --suite Aot.Serialization

      - name: Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Native AOT library verification (net10.0 and net8.0, SQLite and PostgreSQL)
        env:
          LITEGRAPH_TEST_POSTGRESQL_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=litegraph_ci;Username=litegraph;Password=litegraph;Timeout=15;Command Timeout=60
        run: |
          for framework in net10.0 net8.0; do
            dotnet publish src/Test.Aot/Test.Aot.csproj -c Release -f "$framework" -r linux-x64 -o "artifacts/aot/$framework"
            "artifacts/aot/$framework/Test.Aot"
          done

      - name: Native AOT C# SDK verification (SDK suite against a live server)
        run: |
          dotnet build src/LiteGraph.Server/LiteGraph.Server.csproj -c Debug -f net10.0
          server_dir="$(mktemp -d)"
          (cd "$server_dir" && dotnet "$GITHUB_WORKSPACE/src/LiteGraph.Server/bin/Debug/net10.0/LiteGraph.Server.dll" > "$server_dir/server.log" 2>&1 &)
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8701/v1.0/health/ready > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8701/v1.0/health/ready > /dev/null || { cat "$server_dir/server.log"; exit 1; }
          dotnet publish sdk/csharp/src/Test.Automated/Test.Automated.csproj -c Release -r linux-x64 -p:PublishAot=true -o artifacts/sdk-aot
          LITEGRAPH_ENDPOINT=http://localhost:8701 artifacts/sdk-aot/Test.Automated

      - name: Upload test server logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: transaction-gate-logs
          path: /tmp/LiteGraph.Touchstone/**/*.log
          if-no-files-found: ignore
          retention-days: 14

  javascript-sdk:
    name: JavaScript SDK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --runInBand

      - name: Package dry run
        run: npm pack --dry-run

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ".[testing]"

      - name: Test
        run: pytest

      - name: Package build
        run: python -m build

  dashboard:
    name: Dashboard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --runInBand

      - name: Build
        run: npm run build

  docker-config:
    name: Docker configuration
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate compose files and profiles
        env:
          LITEGRAPH_IMAGE_TAG: ci-validate
        run: |
          set -euo pipefail
          for d in single-node-sqlite single-node-postgresql multi-node; do
            docker compose -f docker/$d/compose.yaml config -q
            echo "valid: docker/$d/compose.yaml"
          done
          docker compose -f docker/multi-node/compose.yaml --profile switchboard --profile tools config -q
          echo "valid: docker/multi-node/compose.yaml with profiles switchboard and tools"

      - name: Shell scripts use LF and parse
        run: |
          set -euo pipefail
          if git ls-files --eol '*.sh' | grep -q 'w/crlf'; then git ls-files --eol '*.sh' | grep 'w/crlf'; echo "CRLF found in the shell scripts above"; exit 1; fi
          for f in $(git ls-files '*.sh'); do bash -n "$f"; done
          echo "all shell scripts parse"

  deploy:
    name: Docker deployments (${{ matrix.deployment }})
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        deployment: [single-node-sqlite, single-node-postgresql, multi-node]
    env:
      LITEGRAPH_IMAGE_TAG: ci-${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build images from this commit (not pushed)
        run: |
          set -euo pipefail
          docker build -f src/LiteGraph.Server/Dockerfile -t jchristn77/litegraph:$LITEGRAPH_IMAGE_TAG src
          docker build -f src/LiteGraph.McpServer/Dockerfile -t jchristn77/litegraph-mcp:$LITEGRAPH_IMAGE_TAG .
          docker build -t jchristn77/litegraph-ui:$LITEGRAPH_IMAGE_TAG dashboard

      - name: Start ${{ matrix.deployment }}
        working-directory: docker/${{ matrix.deployment }}
        run: |
          if [ "${{ matrix.deployment }}" = "multi-node" ]; then
            docker compose --profile switchboard up -d --wait --pull missing
          else
            docker compose up -d --wait --pull missing
          fi

      - name: Smoke test
        working-directory: docker/${{ matrix.deployment }}
        shell: pwsh
        run: ./smoke.ps1

      - name: Failover test
        if: matrix.deployment == 'multi-node'
        working-directory: docker/multi-node
        shell: pwsh
        run: ./failover.ps1

      - name: Container logs
        if: failure()
        working-directory: docker/${{ matrix.deployment }}
        run: docker compose --profile switchboard logs --no-color > compose-logs.txt || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-${{ matrix.deployment }}-logs
          path: docker/${{ matrix.deployment }}/compose-logs.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down
        if: always()
        working-directory: docker/${{ matrix.deployment }}
        run: docker compose --profile switchboard --profile tools down -v || true
